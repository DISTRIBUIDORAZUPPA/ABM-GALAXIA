<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABM Galaxia · Zuppa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EDF2EE; --card:#FFFFFF; --ink:#2A1E1F; --ink2:#5A4B4C; --muted:#8E8384; --line:#EAE4DA; --line2:#DCD3C6;
  --nav:#A51F36; --navink:#5A4B4C; --accent:#2BB5AA; --violet:#B98200; --cream:#FBF6EA; --crim:#A51F36; --aqua-bg:#DFF4F1;
  --alta-bg:#DDF2F0; --baja-bg:#FBE3E6; --good-bg:#E4F5E4; --warn-bg:#FFF4D9; --crit-bg:#FBE4E4; --amp:#C62839;
  --r:16px; --shadow:0 1px 2px rgba(60,30,30,.04),0 8px 24px -14px rgba(60,30,30,.20);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
a{color:#00807A}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside.side{overflow-y:auto;background:var(--cream);border-right:1px solid var(--line2);color:var(--navink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 10px;color:var(--ink);font-weight:600;font-size:15px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--crim));color:#fff;display:grid;place-items:center;font-style:normal;font-size:17px}
.brand{background:#000;border-radius:14px;padding:10px 16px;margin:0 2px 8px;display:flex;justify-content:center;box-shadow:0 8px 18px -12px rgba(0,0,0,.6)}
.brand img{width:100%;max-width:118px;height:auto;display:block}
.ttl{display:flex;gap:16px;align-items:center}
.ttl .galx{height:78px;width:auto;flex:0 0 auto}
.embed .brand{display:none} .embed .ttl .galx{height:48px}
@media (max-width:640px){.ttl .galx{height:52px}}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--navink)}
.nav button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:13px;color:var(--navink)}
.nav button:hover{background:var(--aqua-bg);color:var(--ink)}
.nav button.on{background:var(--crim);color:#fff;font-weight:600;box-shadow:0 6px 14px -8px rgba(165,31,54,.7)}
.nav button .ic{width:20px;text-align:center;font-size:15px}
.nav button .n{margin-left:auto;background:#C62839;color:#fff;border-radius:10px;font-size:10.5px;padding:0 6px;line-height:18px;font-weight:600}
.nav button.on .n{background:#fff;color:var(--crim)}
.side .bottom{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line2)}
.qsel{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.qsel button{all:unset;text-align:center;font-size:11.5px;padding:6px 0;border-radius:8px;background:#fff;border:1px solid var(--line2);cursor:pointer;color:var(--ink2)}
.qsel button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.qsel .msel{grid-column:1/-1;margin-top:4px;font-family:var(--sans);font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink)}
.qsel .msel option{color:#16213A}
.embed .qsel{width:auto;display:flex;flex-wrap:wrap;gap:4px} .embed .qsel .msel{margin:0;width:auto}
.geo{font-size:11px;white-space:nowrap;text-decoration:none} .geo:hover{text-decoration:underline}
.formbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,#A51F36,#C62839 60%,#2BB5AA);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:14px}
.formbar .btn{background:#fff}
.hm td.c{text-align:center;font-variant-numeric:tabular-nums;min-width:44px}
.hm tr.tot td{background:#FBF6EA;font-weight:600}
.hm tr.gran td{background:#F4EAD6;font-weight:700}
.hm th.q,.hm td.q{background:#F0F8F6;border-left:1px solid var(--line2)}
.side .upd{font-size:11px;margin-top:10px;color:var(--muted)}
main{padding:22px 26px 50px;min-width:0}
header.top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--title);font-weight:800;font-size:34px;margin:2px 0 0;letter-spacing:-.01em;color:var(--ink)}
h1 em{font-style:normal;color:var(--amp)}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.btn{font-family:var(--sans);font-size:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.dark{background:var(--nav);color:#fff;border-color:var(--nav)}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} .g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0;border:1px solid rgba(210,220,230,.6)}
.card h3{margin:0 0 10px;padding-left:10px;border-left:4px solid var(--crim);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h3 small{font-weight:400;color:var(--muted);font-size:11.5px}
.sec{font-size:15px;font-weight:600;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;background:var(--crim);color:#fff;padding:7px 14px;border-radius:10px}
.sec small{color:#FBE3E6!important} .sec a{color:#fff}
.sec small{font-size:12px;color:var(--muted);font-weight:400}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.tile .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tile:hover{border-color:var(--accent)}
.tile .lab{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.tile .ft{font-size:11.5px;color:var(--ink2)}
.ring{flex:0 0 auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.p-g{background:var(--good-bg);color:#0a7a0a} .p-w{background:var(--warn-bg);color:#8a6000} .p-c{background:var(--crit-bg);color:#b12a2a} .p-n{background:#F1ECE3;color:var(--ink2)} .p-a{background:var(--alta-bg);color:#00635E} .p-b{background:var(--baja-bg);color:#A51F36} .p-v{background:#F7EDD2;color:#7A5600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:500}
.chip.on{background:var(--nav);border-color:var(--nav);color:#fff}
.chip .c{opacity:.65;margin-left:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 12px}
.filters select,.filters input{font-family:var(--sans);font-size:12.5px;padding:7px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink)}
.filters input{min-width:220px}
.tbl-wrap{overflow:auto;border-radius:14px;background:var(--card);max-height:560px;border:1px solid var(--line);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{position:sticky;top:0;background:#FBF6EA;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;z-index:2;font-weight:600}
td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.w{white-space:normal;min-width:180px;max-width:320px}
tr:hover td{background:#F2FAF8}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:11.5px}
.muted{color:var(--muted)} .small{font-size:11.5px}
.av{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#F1E9DA;display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink2);flex:0 0 auto;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.av.lg{width:52px;height:52px;font-size:15px}
.who{display:inline-flex;align-items:center;gap:7px}
.rank{display:grid;grid-template-columns:22px 30px minmax(90px,170px) 1fr 50px;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.rank .nm div{display:inline;margin-left:6px}
.rank .pos{font-weight:700;color:var(--muted);font-size:12px;text-align:right}
.rank .bar{height:10px;border-radius:5px;background:#F1ECE3;overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:5px}
.rank .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rank:hover .nm{color:var(--accent)}
#map{height:430px;border-radius:12px;z-index:1}
.maptools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.loc{display:grid;grid-template-columns:minmax(0,1fr) 34px 34px;gap:6px;align-items:center;padding:5px 4px;border-radius:8px;cursor:pointer;font-size:12px}
.loc:hover{background:#F2FAF8}
.loc .b2{grid-column:1/-1;display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:-2px}
.loc .b2 i{display:block;height:100%}
.loc .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.spv{display:flex;gap:14px;align-items:center}
.spv h4{margin:0;font-size:15px}
.spv.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.spv.st div{background:#FBF6EA;border-radius:10px;padding:8px}
.spv.st b{display:block;font-size:17px}
.spv.st span{font-size:10.5px;color:var(--muted)}
.pend{display:flex;gap:8px;flex-wrap:wrap}
.pend button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow)}
.pend button b{font-size:16px}
.pend button:hover{border-color:var(--accent)}
.funnel{display:flex;flex-direction:column;gap:6px}
.fst{display:grid;grid-template-columns:170px 1fr 50px;gap:10px;align-items:center;cursor:pointer;padding:4px;border-radius:10px}
.fst:hover,.fst.on{background:#F2FAF8}
.fst.on{outline:2px solid var(--accent)}
.fst .shape{height:32px;border-radius:8px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:600;font-size:12px;transition:width .3s;min-width:40px}
.fst .lbl b{display:block;font-size:12.5px} .fst .lbl span{font-size:11px;color:var(--muted)}
.fst .v{text-align:right;font-weight:700;font-size:15px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:#F4EFE4;border-radius:14px;padding:10px;max-height:620px;overflow:auto}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.bc{background:var(--card);border-radius:12px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--shadow)}
.bc .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bc .rs{font-weight:600;font-size:12.5px;margin:2px 0}
.bc .meta{font-size:11px;color:var(--muted)}
.bc .prog{height:6px;border-radius:4px;background:#F1ECE3;margin:7px 0 5px;position:relative;overflow:hidden}
.bc .prog i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bc .plan{font-size:11.5px;margin-top:6px;padding:5px 7px;border-radius:7px;background:#FBF6EA}
.bc .plan.no{background:var(--warn-bg);color:#7a5200}
.bc .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.hb td.act{background:#F0F8F6;text-align:center}
.hb td.act b{display:inline-block;min-width:22px;padding:1px 6px;border-radius:6px;background:#00968F;color:#fff;font-size:11px}
.hb th.act{background:#DDF2F0;color:#00635E}
.hb td.sticky,.hb th.sticky{position:sticky;left:0;z-index:3;background:#fff}
.hb th.sticky{background:#FBF6EA;z-index:4}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow)}
.acts b{display:block;font-size:15px} .acts span{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.note{font-size:12px;color:var(--ink2);background:#FBF6EA;border:1px dashed var(--line2);border-radius:10px;padding:9px 12px}
details.grp{background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
details.grp summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .cnt{font-weight:700;font-size:18px;min-width:40px;text-align:right}
details.grp .body{padding:0 14px 12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.loading{padding:80px 0;text-align:center;font-size:18px;color:var(--muted)}
.chartbox{position:relative;height:250px}
.chartbox.sm{height:190px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap;margin-top:6px}
.osm{filter:saturate(.55) brightness(1.04)}
.modal{position:fixed;inset:0;background:rgba(60,20,25,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.4)}
.modal h3{margin:0 0 4px;font-size:16px} .modal label{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin:12px 0 4px}
.modal input[type=text],.modal input[type=date],.modal input[type=url],.modal input[type=password],.modal textarea{width:100%;font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px}
.modal textarea{min-height:80px;resize:vertical}
.modal .acts2{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.okchk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px;cursor:pointer}
.okchk input{width:18px;height:18px}
.edit{all:unset;cursor:pointer;font-size:12px;padding:3px 8px;border-radius:8px;background:var(--alta-bg);color:#00635E;font-weight:600;white-space:nowrap}
.edit:hover{background:var(--accent);color:#fff}
.user{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink);margin-bottom:10px}
.user button{all:unset;cursor:pointer;color:var(--crim);font-size:11.5px;margin-left:6px}
.login{all:unset;cursor:pointer;display:block;text-align:center;background:var(--crim);color:#fff;font-weight:600;border-radius:10px;padding:8px;font-size:12.5px;margin-bottom:10px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--nav);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:1100;box-shadow:var(--shadow)}
.embed .shell{grid-template-columns:1fr;min-height:0}
.embed body,.embed html{min-height:0}
.embed aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:14px;margin:0 0 12px}
.embed .logo{display:none} .embed .nav{display:flex;flex-wrap:wrap;gap:4px} .embed .nav button{width:auto;padding:7px 10px;font-size:12px}
.embed .side .bottom{margin:0 0 0 auto;border:0;padding:0;display:flex;gap:10px;align-items:center} .embed .side .bottom .small,.embed .side .upd{display:none}
.embed .qsel{margin:0;width:auto} .embed .qsel button{padding:6px 10px} .embed .user,.embed .login{margin:0}
.embed header.top h1{font-size:24px} .embed header.top .kick{display:none} .embed main{padding:12px 4px 30px}
.leaflet-popup-content{font-family:var(--sans);font-size:12px}
@media (max-width:1250px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.shell{grid-template-columns:1fr} aside.side{position:static;height:auto} .nav{display:flex;overflow-x:auto;gap:4px} .nav button{width:auto;white-space:nowrap} .g4,.g3,.g2,.g21,.g12,.board{grid-template-columns:1fr} .side .bottom{border:0;padding-top:4px}}
@media (max-width:640px){.g6{grid-template-columns:repeat(2,minmax(0,1fr))} main{padding:16px 14px 40px} h1{font-size:26px} .filters input{min-width:0;flex:1}}
@media print{aside.side,.noprint,.filters{display:none!important} .shell{display:block} body{background:#fff} .tbl-wrap{max-height:none;overflow:visible;box-shadow:none} th{position:static}}
</style>
</head>
<body>

      fd(a.fi) + (a.cargas > 1 ? ` <span class="pill p-n">${a.cargas}×</span>` : ''), fd(a.ff), `<span class="pill ${a.sla ? 'p-g' : 'p-c'}">${a.dias} d</span>`,

}

/* ---------- ALTAS QUE COMPRARON ---------- */
function vCompraron() {
  const al = altasQ().filter(filtroComun), m = met(al, []);
  const ev = m.altas - m.obs || 1;
  const etapas = [['TODAS', 'Altas realizadas', m.altas, '#5A4B4C', ''], ['FUNCIONA', ETAPA.FUNCIONA[0], m.func, COL.alta, pctTxt(pct(m.func, ev)) + ' de las evaluables'], ['TARDIA', ETAPA.TARDIA[0], m.tard, COL.violet, pctTxt(pct(m.tard, ev))], ['NUNCA', ETAPA.NUNCA[0], m.nunca, COL.baja, pctTxt(pct(m.nunca, ev))], ['OBSERVACION', ETAPA.OBSERVACION[0], m.obs, COL.gris, 'todavía no se evalúan']];
  const hlTot = al.reduce((s, a) => s + (a.hlTot || 0), 0), compr = al.filter(a => a.func === 'FUNCIONA' || a.func === 'TARDIA').length;
  let h = `<div class="filters">${selSpvProm(altasQ())}</div>
  <div class="grid g12">
    <div class="card"><h3>Embudo de altas <small>clic en una etapa para ver esos clientes</small></h3><div class="funnel">` +
    etapas.map(([k, l, v, c, s]) => `<div class="fst ${S.etapa === k ? 'on' : ''}" onclick="S.etapa='${k}';S.mesSel='';render()"><div class="lbl"><b>${l}</b><span>${s}</span></div><div><div class="shape" style="width:${Math.max(8, v / (m.altas || 1) * 100)}%;background:${c}">${v}</div></div><div class="v">${v}</div></div>`).join('') +
    `</div><div class="grid g2" style="margin-top:12px"><div class="note"><b style="font-size:16px">${nf(hlTot, 1)} HL</b><br>comprados por estas altas desde su alta</div><div class="note"><b style="font-size:16px">${nf(compr ? hlTot / compr : 0, 2)} HL</b><br>promedio por alta que compró</div></div>
    <div class="small muted" style="margin-top:8px">"Compraron en ≤30 días" = compra en el mes del alta o el siguiente (VENTA es mensual). Último mes cargado: ${esc(D.cfg.ultimoMesVenta)}.</div></div>
    <div class="card"><h3>Altas por mes y si compraron <small>clic en una barra para filtrar</small></h3><div class="chartbox" style="height:320px"><canvas id="chCoh"></canvas></div></div>
  </div>`;
  const g = {}; al.forEach(a => { const k = a.prom || '—'; g[k] = g[k] || { t: 0, f: 0, o: 0, n: 0, hl: 0 }; g[k].t++; if (a.func === 'FUNCIONA') g[k].f++; if (a.func === 'OBSERVACION') g[k].o++; if (a.func === 'NUNCA') g[k].n++; g[k].hl += a.hlTot || 0; });
  const rk = Object.entries(g).filter(([k, v]) => v.t - v.o > 0).map(([k, v]) => ({ k, v: pct(v.f, v.t - v.o), lbl: pctTxt(pct(v.f, v.t - v.o)), sub: `${v.f} de ${v.t - v.o} · ${v.n} nunca` })).sort((a, b) => b.v - a.v);
  h += `<div class="grid g2" style="margin-top:14px"><div class="card"><h3>% de altas que compraron por promotor</h3>${rankList(rk, COL.alta, k => `S.prom='${esc(k)}';render()`)}</div>
    <div class="card"><h3>HL comprados por las altas, por promotor</h3>${rankList(Object.entries(g).map(([k, v]) => ({ k, v: v.hl, lbl: nf(v.hl, 1) })).sort((a, b) => b.v - a.v), COL.violet, k => `S.prom='${esc(k)}';render()`)}</div></div>`;
  let L = al.filter(a => S.etapa === 'TODAS' || a.func === S.etapa);
  if (S.mesSel !== '') L = L.filter(a => +a.ff.slice(5, 7) - 1 === +S.mesSel);
  const tit = (S.etapa === 'TODAS' ? 'Todas las altas' : ETAPA[S.etapa][0]) + (S.mesSel !== '' ? ' · ' + MES[+S.mesSel] : '');
  h += `<div class="sec">${tit} <small>${L.length} clientes${S.etapa !== 'TODAS' || S.mesSel !== '' ? ` · <a href="#" onclick="S.etapa='TODAS';S.mesSel='';render();return false">ver todas</a>` : ''}</small></div>`;
  h += tabla(['Código', 'Razón social', 'Promotor', 'Localidad', 'Ubicación', 'Subcanal', 'Alta', 'Días desde el alta', 'HL mes alta', 'HL mes sig.', 'HL total', 'Estado', ''],
    L.sort((a, b) => a.ff > b.ff ? 1 : -1).map(a => [`<span class="code">${esc(a.c)}</span>`, { v: esc(a.rs) + (a.activo === false ? ' <span class="pill p-n">anulado</span>' : ''), cls: 'w' }, who(a.prom), esc(a.loc), ubic(a), esc(a.sub), fd(a.ff),
      { v: Math.round((new Date(D.hoy) - new Date(a.ff)) / 864e5) }, { v: nf(a.hl0, 2) }, { v: nf(a.hl1, 2) }, { v: nf(a.hlTot, 2) }, `<span class="pill ${ETAPA[a.func][2]}">${ETAPA[a.func][0]}</span>`,
      a.fila ? `<a href="${sheetLink(D.cfg.gidAlta, a.fila)}" target="_blank">fila ${a.fila}</a>` : '']));
  setTimeout(() => {
    const ks = ['FUNCIONA', 'TARDIA', 'NUNCA', 'OBSERVACION'], last = Math.max(0, ...al.map(a => +a.ff.slice(5, 7))) || 9;
    const ds = ks.map(k => ({ label: ETAPA[k][0], data: MES.slice(0, last).map((_, i) => al.filter(a => a.func === k && +a.ff.slice(5, 7) - 1 === i).length), backgroundColor: ETAPA[k][1], borderRadius: 3, maxBarThickness: 26, borderColor: '#fff', borderWidth: { top: 2 } }));
    chart('chCoh', { type: 'bar', data: { labels: MES.slice(0, last), datasets: ds }, options: baseOpts({ scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: '#F1ECE3' } } },
      onClick: (e, el) => { if (el.length) { S.etapa = ks[el[0].datasetIndex]; S.mesSel = String(el[0].index); render(); } } }) });
  }, 0);
  return h;
}

/* ---------- BAJAS · HOJA COMPLETA ---------- */
function vHoja() {
  const HB = D.hojaBaja;
  if (!HB) return '<div class="card empty">Todavía no llegó la hoja BAJA al tablero. Corré "Publicar solo los datos" con el script nuevo.</div>';
  const H = HB.hdr, nh = H.map(x => x.toUpperCase());
  const ci = n => nh.findIndex(x => x.indexOf(n) === 0);
  const cSt = ci('STATUS'), cSpv = ci('SUPERVISOR'), cProm = ci('PROMOTOR'), cRs = ci('RAZON SOCIAL'), cCod = HB.cod;
  const [a0, a1] = HB.activos;
  const porCod = {}; D.bajas.forEach(b => porCod[b.c] = b);
  const code = r => String(r.v[cCod]).replace(/\D/g, '').replace(/^0+/, '');
  const num = v => parseFloat(String(v).replace(/\./g, '').replace(',', '.')) || 0;
  const R = HB.rows.filter(r => {
    if (S.hbStatus && String(r.v[cSt]).toUpperCase() !== S.hbStatus) return false;
    if (S.spv && String(r.v[cSpv]).toUpperCase() !== S.spv) return false;
    if (S.prom && String(r.v[cProm]).toUpperCase() !== S.prom) return false;
    if (S.hbAct && !r.v.slice(a0, a1 + 1).some(v => num(v) > 0)) return false;
    if (S.txt && !r.v.join(' ').toUpperCase().includes(S.txt.toUpperCase())) return false;
    return true;
  });
  const sts = [...new Set(HB.rows.map(r => String(r.v[cSt]).toUpperCase()).filter(Boolean))];
  const spvs = [...new Set(HB.rows.map(r => String(r.v[cSpv]).toUpperCase()).filter(Boolean))].sort();
  const proms = [...new Set(HB.rows.filter(r => !S.spv || String(r.v[cSpv]).toUpperCase() === S.spv).map(r => String(r.v[cProm]).toUpperCase()).filter(Boolean))].sort((a, b) => (parseInt(a) || 999) - (parseInt(b) || 999));
  const tot = H.slice(a0, a1 + 1).map((n, i) => ({ n, v: R.reduce((s, r) => s + num(r.v[a0 + i]), 0) }));
  let h = `<div class="note" style="margin-bottom:10px">Es la hoja <b>BAJA</b> del Sheet tal cual, con todas sus columnas y los activos fijos. ${D.cfg.webApp ? (S.user ? 'Tocá <b>✏️ Editar</b> para cargar plan de acción, responsable, deadline, comentarios y evidencia, o marcá el <b>OK supervisor</b> directo en la tabla: se guarda en el Sheet.' : 'Supervisores: tocá <b>🔐 Ingresar para editar</b> (abajo a la izquierda) para cargar el OK y los planes de acción desde acá.') : 'Para cargar plan de acción u OK supervisor, usá el link "fila" (abre el Sheet en esa fila).'}</div>`;
  h += `<div class="filters"><select onchange="S.hbStatus=this.value;render()"><option value="">Todos los status</option>${sts.map(s => `<option ${S.hbStatus === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <select onchange="S.spv=this.value;S.prom='';render()"><option value="">Todos los supervisores</option>${spvs.map(s => `<option ${S.spv === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <select onchange="S.prom=this.value;render()"><option value="">Todos los promotores</option>${proms.map(s => `<option ${S.prom === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <input placeholder="Buscar en toda la hoja…" value="${esc(S.txt)}" oninput="S.txt=this.value;clearTimeout(window._t);window._t=setTimeout(render,300)">
    <span class="chip ${S.hbAct ? 'on' : ''}" onclick="S.hbAct=!S.hbAct;render()">Solo con activos fijos</span>
    <button class="btn" onclick="csvHoja()">⬇ CSV</button></div>`;
  h += `<div class="acts" style="margin-bottom:12px"><div><b>${R.length}</b><span>filas</span></div>${tot.filter(t => t.v > 0).map(t => `<div><b>${nf(t.v)}</b><span>${esc(t.n)}</span></div>`).join('')}</div>`;
  const I = hbIdx();
  const cols = ['', 'Semáforo'].concat(H).concat(['Ubicación', 'Evidencia', '']);
  h += `<div class="tbl-wrap" style="max-height:640px"><table class="hb"><thead><tr>${cols.map((c, i) => { const j = i - 2; return `<th class="${j >= a0 && j <= a1 ? 'act' : j === cCod ? 'sticky' : ''}">${esc(c)}</th>`; }).join('')}</tr></thead><tbody>` +
    R.map(r => { const b = porCod[code(r)];
      const ed = puedeEditar(r.v[cSpv]), cd = code(r);
      return '<tr>' + `<td>${ed ? `<button class="edit" onclick="editarBaja('${cd}')">✏️ Editar</button>` : ''}</td><td>${b && SEM[b.sem] ? `<span class="pill ${SEM[b.sem][1]}">${SEM[b.sem][0]}</span>` : ''}${b && b.reactivado ? ' <span class="pill p-v" title="Se dio de baja y hoy figura activo en BASE CLIENTES">↺ reactivado</span>' : ''}</td>` + r.v.map((v, j) => {
        if (j === I.ok) { const on = /^(TRUE|SI|SÍ|OK)$/i.test(String(v)); return `<td style="text-align:center">${ed ? `<input type="checkbox" ${on ? 'checked' : ''} title="OK supervisor" onchange="guardarBaja('${cd}', this.checked)" style="width:17px;height:17px;cursor:pointer">` : (on ? '✅' : '☐')}</td>`; }
        if (j >= a0 && j <= a1) return `<td class="act">${num(v) > 0 ? `<b>${esc(v)}</b>` : '<span class="muted">·</span>'}</td>`;
        if (j === cSt) { const s = String(v).toUpperCase(); return `<td><span class="pill ${s === 'COMPLETADO' ? 'p-g' : s === 'EN PROCESO' ? 'p-w' : 'p-n'}">${esc(v)}</span></td>`; }
        if (j === cCod) return `<td class="sticky code">${esc(v)}</td>`;
        if (j === cSpv || j === cProm) return `<td>${who(v)}</td>`;
        if (String(v).toUpperCase() === 'TRUE') return '<td>✅</td>'; if (String(v).toUpperCase() === 'FALSE') return '<td>☐</td>';
        return `<td class="${String(v).length > 30 ? 'w' : ''}">${esc(v)}</td>`;
      }).join('') + `<td>${ubic(b)}</td><td>${r.e ? `<a href="${esc(r.e)}" target="_blank">📎 ver</a>` : ''}</td><td><a href="${sheetLink(D.cfg.gidBaja, r.f)}" target="_blank">fila ${r.f} ↗</a></td></tr>`;
    }).join('') + '</tbody></table></div>';
  return h;
}

/* ---------- ALERTAS DE BAJAS ---------- */
function vAlertas() {
  const pend = pendientes().filter(filtroComun);
  const fuera = bajasOk().filter(filtroComun).filter(b => b.dh > D.cfg.slaBaja);
  const prox = pend.filter(b => b.sem !== 'ROJO' && b.fo && (new Date(b.fo) - new Date(D.hoy)) / 864e5 <= 14);
  const pr = pend.filter(b => b.sem === 'ROJO'), pa = pend.filter(b => b.sem === 'AMARILLO');
  const compF = fuera.filter(b => b.estado === 'COMPLETADO');
  let h = `<div class="grid g4">
    ${tile('Pendientes +45 hábiles', nf(pr.length), `${pr.filter(b => !b.plan).length} sin plan · ${pr.filter(b => !b.evid).length} sin evidencia`, '<span style="font-size:26px">⛔</span>', "S.alertaVista='todas';render()")}
    ${tile('Pendientes 31 a 45', nf(pa.length), 'por vencer', '<span style="font-size:26px">⚠</span>', "S.alertaVista='todas';render()")}
    ${tile('Vencen en 14 días', nf(prox.length), 'en plazo, a vigilar', '<span style="font-size:26px">⏳</span>', "S.alertaVista='prox';render()")}
    ${tile('No cumplieron 45 días', nf(fuera.length), `${compF.length} completadas tarde · ${fuera.length - compF.length} pendientes`, '<span style="font-size:26px">🗂</span>', "S.alertaVista='fuera';render()")}
  </div>
  <div class="filters">${selSpvProm(bajasOk())}
    ${[['todas', 'Semáforo'], ['fuera', 'No cumplieron 45 días'], ['prox', 'Por vencer'], ['sigue', 'Siguen comprando'], ['desc', 'No corresponden · ' + bajasDesc().length]].map(([k, l]) => `<span class="chip ${S.alertaVista === k ? 'on' : ''}" onclick="S.alertaVista='${k}';render()">${l}</span>`).join('')}
    <button class="btn" onclick="csvBajas()">⬇ CSV</button></div>`;
  if (S.alertaVista === 'desc') {
    const L = bajasDesc().filter(filtroComun);
    return h + `<div class="sec">Pedidos de baja marcados como "no corresponde" <small>${L.length} · no cuentan como pendientes ni para el SLA de 45 días</small></div>` +
      tabla(['Código', 'Razón social', 'Supervisor', 'Promotor', 'Pedido', 'Motivo / comentario', 'Estado en base', ''], L.map(b => [`<span class="code">${esc(b.c)}</span>`, { v: esc(b.rs), cls: 'w' }, who(b.spv), who(b.prom), fd(b.fi), { v: esc(b.com || ''), cls: 'w' }, b.activo ? 'ACTIVO' : 'ANULADO',
        (puedeEditar(b.spv) ? `<button class="edit" onclick="editarBaja('${esc(b.c)}')">✏️ Editar</button> ` : '') + (b.fila ? `<a href="${sheetLink(D.cfg.gidBaja, b.fila)}" target="_blank">fila ${b.fila}</a>` : '')]));
  }
  if (S.alertaVista === 'fuera') {
    return h + `<div class="sec">Bajas que no cumplieron los 45 días hábiles <small>${fuera.length} · pendientes y completadas</small></div>` +
      tabla(['Estado', 'Código', 'Razón social', 'Ubicación', 'Supervisor', 'Promotor', 'Motivo', 'Pedido', 'Anulación', 'Hábiles', 'Plan de acción', 'Responsable', 'Deadline', 'Evidencia', ''],
        fuera.sort((a, b) => b.dh - a.dh).map(b => [`<span class="pill ${SEM[b.sem][1]}">${b.estado === 'COMPLETADO' ? 'Completada tarde' : 'Pendiente'}</span>`, `<span class="code">${esc(b.c)}</span>`, { v: esc(b.rs), cls: 'w' }, ubic(b), who(b.spv), who(b.prom), esc(b.mot), fd(b.fi) + (b.arrastre ? ' <span class="pill p-n">arrastre</span>' : ''), fd(b.ff) || '—',
          { v: `<b style="color:${COL.crit}">${b.dh}</b>` }, { v: esc(b.plan || '⚠ sin plan'), cls: 'w' }, esc(b.resp), fd(b.dl), b.evid ? `<a href="${esc(b.evid)}" target="_blank">📎</a>` : '<span class="pill p-c">falta</span>', b.fila ? `<a href="${sheetLink(D.cfg.gidBaja, b.fila)}" target="_blank">fila ${b.fila}</a>` : '']));
  }
  let P = pend;
  if (S.alertaVista === 'prox') P = prox; else if (S.alertaVista === 'sigue') P = pend.filter(b => b.hlPost > 0);
  const col = (cls, tit, arr) => `<div class="col"><h4>${tit}<span class="pill ${cls}">${arr.length}</span></h4>${arr.sort((a, b) => b.dh - a.dh).map(cardBaja).join('') || '<div class="empty">—</div>'}</div>`;
  return h + `<div class="board">${col('p-c', '⛔ Más de 45 hábiles', P.filter(b => b.sem === 'ROJO'))}${col('p-w', '⚠ 31 a 45 hábiles', P.filter(b => b.sem === 'AMARILLO'))}${col('p-g', '✓ 0 a 30 hábiles', P.filter(b => b.sem === 'VERDE'))}</div>`;
}
function cardBaja(b) {
  const w = Math.min(100, b.dh / 60 * 100), col = b.sem === 'ROJO' ? COL.crit : b.sem === 'AMARILLO' ? COL.warn : COL.good;
  const tags = [];
  if (b.edf) Object.entries(b.edf).forEach(([k, v]) => tags.push(`<span class="pill p-v">${esc(k)} ${nf(v)}</span>`));
  if (b.deuda) tags.push(`<span class="pill p-c">Deuda $${nf(b.deuda.saldo)}</span>`);
  if (b.hlPost > 0) tags.push(`<span class="pill p-b">🛒 sigue comprando · ${nf(b.hlPost, 2)} HL</span>`);
  if (b.pedidos > 1) tags.push(`<span class="pill p-n">${b.pedidos} pedidos</span>`);
  if (b.ok) tags.push(`<span class="pill p-g">✓ OK supervisor</span>`);
  if (b.evid) tags.push(`<a class="pill p-g" href="${esc(b.evid)}" target="_blank">📎 evidencia</a>`); else if (b.sem === 'ROJO') tags.push(`<span class="pill p-c">sin evidencia</span>`);
  return `<div class="bc"><div class="t"><span class="code"><b>${esc(b.c)}</b></span><span class="pill ${SEM[b.sem][1]}">${b.dh} hábiles</span></div>
    <div class="rs">${esc(b.rs)}</div><div class="meta">${who(b.prom)} · pedido ${fd(b.fi)} · vence ${fd(b.fo)}</div>
    <div class="prog"><i style="width:${w}%;background:${col}"></i><span style="position:absolute;left:75%;top:0;bottom:0;border-left:2px dashed #16213A;opacity:.35"></span></div>
    <div class="meta">${esc(b.mot)}${b.loc ? ' · ' + esc(b.loc) : ''} · ${ubic(b)}</div>
    <div class="plan ${b.plan ? '' : 'no'}">${b.plan ? '📝 ' + esc(b.plan) + (b.resp ? ` <span class="muted">· ${esc(b.resp)}${b.dl ? ' · ' + fd(b.dl) : ''}</span>` : '') : '⚠ Sin plan de acción'}</div>
    <div class="tags">${puedeEditar(b.spv) ? `<button class="edit" onclick="editarBaja('${esc(b.c)}')">✏️ ${b.plan ? 'Editar plan' : 'Cargar plan'}</button>` : ''}${tags.join('')}${b.fila ? `<a class="pill p-n" href="${sheetLink(D.cfg.gidBaja, b.fila)}" target="_blank">fila ${b.fila} ↗</a>` : ''}</div></div>`;
}

/* ---------- EQUIPO ---------- */
function vEquipo() {

  let h = `<div class="grid g2">` + spvs.map(s => { const x = met(al.filter(a => spvOf(a) === s), bj.filter(b => spvOf(b) === s));
    return `<div class="card" style="cursor:pointer;${S.spv === s ? 'outline:2px solid var(--accent)' : ''}" onclick="S.spv=S.spv==='${esc(s)}'?'':'${esc(s)}';render()"><div class="spv">${avatar(s, true)}<div style="flex:1"><div class="small muted">Supervisor ${S.spv === s ? '· filtrando' : '· clic para filtrar'}</div><h4>${esc(s)}</h4></div></div>

      <div class="card"><h3>Bajas por localidad <small>top 12</small></h3><div class="chartbox"><canvas id="cg3"></canvas></div></div></div>`;
    setTimeout(() => {
      const pal = [COL.baja, COL.violet, COL.alta, '#eda100', '#e87ba4', '#4a3aa7', '#A9B4C4'];
      chart('cg1', { type: 'bar', data: { labels: meses.map(i => MES[i]), datasets: mots.slice(0, 6).map((mo, k) => ({ label: mo, data: meses.map(i => arr.filter(b => (b.mot || 'SIN MOTIVO') === mo && mesBaja(b) === i).length), backgroundColor: pal[k], borderRadius: 3, maxBarThickness: 24 })) }, options: baseOpts({ scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true } } }) });
      const comp = arr.filter(b => b.estado === 'COMPLETADO');
      chart('cg2', { type: 'bar', data: { labels: meses.map(i => MES[i]), datasets: [{ label: 'Promedio días hábiles', data: meses.map(i => { const x = comp.filter(b => b.ff && mesDe(b.ff) === i && b.ff.slice(0, 4) === String(D.cfg.anio)); return x.length ? Math.round(x.reduce((s, b) => s + b.dh, 0) / x.length * 10) / 10 : 0; }), backgroundColor: meses.map(i => COL.baja), borderRadius: 4, maxBarThickness: 22 }] }, options: baseOpts({ plugins: { legend: { display: false } } }) });
      const lc = Object.entries(arr.reduce((o, b) => (o[b.loc || 'SIN LOCALIDAD'] = (o[b.loc || 'SIN LOCALIDAD'] || 0) + 1, o), {})).sort((a, b) => b[1] - a[1]).slice(0, 12);
      chart('cg3', { type: 'bar', data: { labels: lc.map(x => x[0]), datasets: [{ label: 'Bajas', data: lc.map(x => x[1]), backgroundColor: COL.baja, borderRadius: 4, maxBarThickness: 16 }] }, options: baseOpts({ indexAxis: 'y', plugins: { legend: { display: false } } }) });
    }, 0);
  }
  return h;
}

/* ---------- CALIDAD ---------- */
function vCalidad() {
  const g = {}; D.control.forEach(c => { if (S.ctlSev && c.sev !== S.ctlSev) return; (g[c.tipo] = g[c.tipo] || { sev: c.sev, l: [] }).l.push(c); });
  const ord = { alta: 0, media: 1, baja: 2 }, cnt = s => D.control.filter(c => c.sev === s).length;
  const h = `<div class="chips" style="margin-bottom:12px">${[['', 'Todas', D.control.length], ['alta', 'Prioridad alta', cnt('alta')], ['media', 'Media', cnt('media')], ['baja', 'Baja', cnt('baja')]].map(([k, l, n]) => `<span class="chip ${S.ctlSev === k ? 'on' : ''}" onclick="S.ctlSev='${k}';render()">${l}<span class="c">${n}</span></span>`).join('')}</div>`;
  return h + (Object.entries(g).sort((a, b) => ord[a[1].sev] - ord[b[1].sev] || b[1].l.length - a[1].l.length).map(([t, x]) => `<details class="grp"><summary><span class="cnt" style="color:${x.sev === 'alta' ? COL.crit : x.sev === 'media' ? '#B07A00' : COL.gris}">${x.l.length}</span><span style="flex:1"><b>${esc(t)}</b></span><span class="pill ${x.sev === 'alta' ? 'p-c' : x.sev === 'media' ? 'p-w' : 'p-n'}">${x.sev}</span></summary>
    <div class="body">${tabla(['Código / CUIT', 'Detalle'], x.l.map(c => [`<span class="code">${esc(c.ref)}</span>`, { v: esc(c.det), cls: 'w' }]))}</div></details>`).join('') || '<div class="card empty">Sin observaciones 🎉</div>');
}

/* ---------- AUDITOR ---------- */

  const al = altasQ(), bj = bajasQ(), m = met(al, bj);
  let h = `<div class="filters noprint"><button class="btn dark" onclick="window.print()">🖨 Imprimir / PDF</button><button class="btn" onclick="csvAltas(true)">⬇ Altas CSV</button><button class="btn" onclick="csvBajas(true)">⬇ Bajas CSV</button><span class="muted small">Elegí el período en el menú de la izquierda.</span></div>
  <div class="card"><h3>Evidencia ABM · ${qTxt()} <small>generado ${fd(D.hoy)}</small></h3>
  <div class="grid g4">${tile('Altas', m.altas, `${pctTxt(m.pSla)} en ≤3 días · ${m.fuera} desvíos (${m.conCausa} con causa)`)}${tile('Promedio alta', nf(m.prom, 1) + ' d', 'días corridos formulario → sistema')}${tile('Bajas completadas', m.comp, `${pctTxt(m.pBsla)} en ≤45 días hábiles`)}${tile('Bajas pendientes', m.pend, `${m.rojo} con +45 hábiles`)}</div>
  <p class="small" style="margin-top:12px"><b>Criterios.</b> <b>Alta</b>: desde la primera carga del formulario hasta la fecha de alta en el sistema; SLA ≤ ${D.cfg.slaAlta} días corridos; los desvíos llevan su causa en la columna M de la hoja ALTA.
  <b>Baja</b>: desde el primer pedido del formulario hasta la fecha de anulación en el sistema; SLA ≤ ${D.cfg.slaBaja} días hábiles (sin fines de semana ni feriados); el reloj no se detiene por EDF robado ni por la espera del OK de CMQ. Los casos de más de 45 días llevan plan de acción, responsable, deadline y evidencia.</p></div>`;
  h += `<div class="sec">Altas con desvío (+3 días)</div>` + tabla(['Código', 'Razón social', 'Promotor', 'Pedido', 'Alta', 'Días', 'Causa'], al.filter(a => !a.sla).map(a => [a.c, esc(a.rs), esc(a.prom), fd(a.fi), fd(a.ff), { v: a.dias }, esc(a.obs || '(sugerida) ' + a.sug)]));
  h += `<div class="sec">Bajas con más de 45 días hábiles</div>` + tabla(['Código', 'Razón social', 'Supervisor', 'Pedido', 'Anulación', 'Hábiles', 'Estado', 'Plan de acción', 'Responsable', 'Deadline', 'Evidencia'],
    bj.filter(b => b.dh > D.cfg.slaBaja).sort((a, b) => b.dh - a.dh).map(b => [b.c, esc(b.rs), esc(b.spv), fd(b.fi), fd(b.ff) || '—', { v: b.dh }, esc(b.estado), { v: esc(b.plan || '—'), cls: 'w' }, esc(b.resp || ''), fd(b.dl), b.evid ? `<a href="${esc(b.evid)}" target="_blank">ver</a>` : '<b style="color:#d03b3b">falta</b>']));
  h += `<div class="sec">Todas las altas del período</div>` + tabla(['Q', 'Código', 'Razón social', 'Promotor', 'Pedido', 'Alta', 'Días', '≤3d'], al.map(a => [a.q, a.c, esc(a.rs), esc(a.prom), fd(a.fi), fd(a.ff), { v: a.dias }, a.sla ? 'SÍ' : 'NO']));
  h += `<div class="sec">Todas las bajas del período</div>` + tabla(['Q', 'Código', 'Razón social', 'Motivo', 'Pedido', 'Anulación', 'Hábiles', 'Estado'], bj.map(b => [b.q, b.c, esc(b.rs), esc(b.mot), fd(b.fi), fd(b.ff), { v: b.dh }, esc(b.estado)]));
  return h;
}

/* ---------- CSV ---------- */
function csv(nombre, cols, rows) {
  const e = v => { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + [cols.join(';')].concat(rows.map(r => r.map(e).join(';'))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = nombre; a.click();
}
const dec = v => String(v == null ? 0 : v).replace('.', ',');
function csvAltas(todo) {
  const L = todo ? altasQ() : altasQ().filter(filtroComun);
  csv(`altas_${S.q}_${D.hoy}.csv`, ['Q', 'Codigo', 'Razon social', 'Canal', 'Subcanal', 'Localidad', 'Supervisor', 'Promotor', 'Pedido form', 'Alta sistema', 'Dias corridos', 'Dias habiles', 'En SLA 3d', 'Causa col M', 'Causa sugerida', 'Cargas form', 'Compro', 'HL mes alta', 'HL mes sig', 'HL desde alta'],
    L.map(a => [a.q, a.c, a.rs, a.canal, a.sub, a.loc, a.spv, a.prom, a.fi, a.ff, a.dias, a.dh, a.sla ? 'SI' : 'NO', a.obs, a.sug, a.cargas, ETAPA[a.func][0], dec(a.hl0), dec(a.hl1), dec(a.hlTot)]));
}
function csvBajas(todo) {
  const L = todo ? bajasQ() : bajasOk().filter(filtroComun);
  csv(`bajas_${S.q}_${D.hoy}.csv`, ['Q', 'Codigo', 'Razon social', 'Canal', 'Localidad', 'Supervisor', 'Promotor', 'Motivo', 'Pedido form', 'Anulacion sistema', 'Fecha objetivo 45h', 'Dias habiles', 'Dias corridos', 'Estado', 'Semaforo', 'Plan de accion', 'Responsable', 'Deadline', 'Evidencia', 'Pedidos form', 'HL post pedido'],
    L.map(b => [b.q, b.c, b.rs, b.canal, b.loc, b.spv, b.prom, b.mot, b.fi, b.ff, b.fo, b.dh, b.dc, b.estado, b.sem, b.plan, b.resp, b.dl, b.evid, b.pedidos, dec(b.hlPost)]));
}
function csvHoja() { const HB = D.hojaBaja; if (!HB) return; csv(`hoja_baja_${D.hoy}.csv`, HB.hdr.concat(['Evidencia']), HB.rows.map(r => r.v.concat([r.e]))); }


/* ---------- edición (Web App) ---------- */
function leerUser() { try { return JSON.parse(sessionStorage.getItem('abmUser') || 'null'); } catch (e) { return null; } }
function guardarUser(u) { try { if (u) sessionStorage.setItem('abmUser', JSON.stringify(u)); else sessionStorage.removeItem('abmUser'); } catch (e) { } }
S.user = leerUser();
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
function puedeEditar(spv) { return !!(S.user && D.cfg.webApp && (S.user.spv === '*' || String(spv || '').toUpperCase() === S.user.spv)); }
function renderUser() {
  const el = $('#userbox'); if (!el) return;
  if (!D.cfg.webApp) { el.innerHTML = ''; return; }
  el.innerHTML = S.user ? `<div class="user">✏️ Editando como <b>${esc(S.user.nombre)}</b><button onclick="salir()">salir</button></div>` : `<button class="login" onclick="abrirLogin()">🔐 Ingresar para editar</button>`;
}
function salir() { S.user = null; guardarUser(null); render(); }
function cerrarModal() { $('#modal').innerHTML = ''; }
function abrirLogin() {
  $('#modal').innerHTML = `<div class="modal" onclick="if(event.target===this)cerrarModal()"><div class="box"><h3>Ingresar para editar</h3><div class="small muted">Supervisores y jefe de ventas: usá tu clave para cargar OK, planes de acción y evidencias de las bajas.</div>
    <label>Clave</label><input type="password" id="clave" onkeydown="if(event.key==='Enter')login()"><div id="lerr" class="small" style="color:#d03b3b;margin-top:6px"></div>
    <div class="acts2"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn dark" onclick="login()">Ingresar</button></div></div></div>`;
  setTimeout(() => $('#clave') && $('#clave').focus(), 50);
}
async function login() {
  const clave = $('#clave').value.trim(); if (!clave) return;
  try {
    const r = await (await fetch(D.cfg.webApp + '?action=login&clave=' + encodeURIComponent(clave))).json();
    if (!r.ok) { $('#lerr').textContent = r.error || 'Clave incorrecta'; return; }
    S.user = { clave, nombre: r.nombre, spv: r.spv }; guardarUser(S.user); cerrarModal(); toast('Hola ' + r.nombre + ' 👋'); render();
  } catch (e) { $('#lerr').textContent = 'No pude conectarme con el Sheet (' + e.message + ')'; }
}
function hbIdx() {
  const HB = D.hojaBaja; if (!HB) return {};
  const n = HB.hdr.map(x => x.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim());
  const f = k => n.findIndex(x => x.indexOf(k) === 0);
  return { ok: f('OK SUPERVISOR'), com: f('COMENTARIOS'), plan: f('PLAN DE ACCION'), resp: f('RESPONSABLE'), dl: f('DEAD LINE') };
}
function aplicarEdicion(code, f) {
  const b = D.bajas.find(x => x.c === code);
  if (b) { b.ok = f.ok; b.com = f.com; b.plan = f.plan; b.resp = f.resp; b.dl = f.dl; b.evid = f.evid;
    if (f.desc && b.estado !== 'COMPLETADO') { b.estado = 'DESCARTADA'; b.sem = 'DESCARTADA'; }
    else if (!f.desc && b.estado === 'DESCARTADA') { b.estado = 'EN PROCESO'; b.sem = b.dh > D.cfg.slaBaja ? 'ROJO' : b.dh >= D.cfg.amarillo ? 'AMARILLO' : 'VERDE'; } }
  const HB = D.hojaBaja; if (!HB) return;
  const I = hbIdx(), r = HB.rows.find(x => String(x.v[HB.cod]).replace(/\D/g, '').replace(/^0+/, '') === code);
  if (!r) return;
  if (I.ok >= 0) r.v[I.ok] = f.ok ? 'TRUE' : 'FALSE';
  if (I.com >= 0) r.v[I.com] = f.com; if (I.plan >= 0) r.v[I.plan] = f.plan; if (I.resp >= 0) r.v[I.resp] = f.resp;
  if (I.dl >= 0) r.v[I.dl] = f.dl ? fd(f.dl).replace(/(\d\d)$/, '20$1') : '';
  r.e = f.evid;
  const cSt = HB.hdr.findIndex(x => x.toUpperCase().indexOf('STATUS') === 0); if (cSt >= 0 && f.st) r.v[cSt] = f.st;
}
async function traerEdiciones() {
  if (!D.cfg.webApp) return;
  try { const r = await (await fetch(D.cfg.webApp + '?action=bajas&t=' + Date.now())).json(); if (r.ok) Object.entries(r.rows).forEach(([c, f]) => aplicarEdicion(c, f)); } catch (e) { }
  try { const r = await (await fetch(D.cfg.webApp + '?action=solicitudes&t=' + Date.now())).json(); if (r.ok) Object.entries(r.rows).forEach(([id, g]) => aplicarSol(id, g)); } catch (e) { }
}
function editarBaja(code) {
  const b = D.bajas.find(x => x.c === code) || { c: code };
  const resps = [...new Set(D.bajas.map(x => x.spv).concat(D.bajas.map(x => (x.prom || '').replace(/^\d+--/, ''))).filter(Boolean))].sort();
  $('#modal').innerHTML = `<div class="modal" onclick="if(event.target===this)cerrarModal()"><div class="box">
    <h3>Baja ${esc(code)} · ${esc(b.rs || '')}</h3><div class="small muted">${esc(b.spv || '')} · ${esc((b.prom || '').replace(/^\d+--/, ''))} · pedido ${fd(b.fi)} · ${b.dh != null ? b.dh + ' días hábiles' : ''}</div>
    <label class="okchk"><input type="checkbox" id="e_ok" ${b.ok ? 'checked' : ''}> <b>OK supervisor</b> — la baja está controlada</label>
    <label>Plan de acción</label><textarea id="e_plan" placeholder="Qué se va a hacer, cómo y cuándo">${esc(b.plan || '')}</textarea>
    <div class="grid g2" style="gap:10px"><div><label>Responsable</label><input type="text" id="e_resp" list="e_resps" value="${esc(b.resp || b.spv || '')}"><datalist id="e_resps">${resps.map(r => `<option value="${esc(r)}">`).join('')}</datalist></div>
    <div><label>Deadline</label><input type="date" id="e_dl" value="${esc(b.dl || '')}"></div></div>
    <label>Comentarios</label><input type="text" id="e_com" value="${esc(b.com || '')}">
    <label>Link de evidencia (foto, mail, Drive)</label><input type="url" id="e_evid" placeholder="https://…" value="${esc(b.evid || '')}">
    <div style="margin-top:14px;padding:10px 12px;border-radius:10px;background:#FBF6EA;border:1px dashed var(--line2)">
      <label class="okchk" style="margin:0"><input type="checkbox" id="e_desc" ${b.estado === 'DESCARTADA' ? 'checked' : ''} onchange="$('#e_mot').style.display=this.checked?'block':'none'"> <b>Este pedido de baja no corresponde</b> (error de carga, el cliente sigue)</label>
      <div id="e_mot" style="display:${b.estado === 'DESCARTADA' ? 'block' : 'none'}"><label>Motivo</label><input type="text" id="e_motivo" placeholder="Ej.: se cargó mal el código, el cliente sigue comprando" value="${esc((b.com || '').replace(/^NO CORRESPONDE:\s*/, ''))}">
      <div class="small muted" style="margin-top:4px">Queda con STATUS "NO REALIZADO" en la hoja BAJA y sale de pendientes y alertas.</div></div></div>
    <div id="e_err" class="small" style="color:#d03b3b;margin-top:8px"></div>
    <div class="acts2"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn dark" id="e_btn" onclick="guardarBaja('${esc(code)}')">💾 Guardar en el Sheet</button></div></div></div>`;
}
async function guardarBaja(code, soloOk) {
  let campos = soloOk != null ? { ok: soloOk } : { ok: $('#e_ok').checked, plan: $('#e_plan').value.trim(), resp: $('#e_resp').value.trim(), dl: $('#e_dl').value, com: $('#e_com').value.trim(), evid: $('#e_evid').value.trim(), descartar: $('#e_desc').checked };
  if (campos.descartar) { const mo = $('#e_motivo').value.trim(); if (!mo) { $('#e_err').textContent = 'Escribí el motivo por el que no corresponde.'; return; } campos.com = 'NO CORRESPONDE: ' + mo; }
  const btn = $('#e_btn'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  try {
    const r = await (await fetch(D.cfg.webApp, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'guardarBaja', clave: S.user.clave, codigo: code, campos }) })).json();
    if (!r.ok) { if ($('#e_err')) $('#e_err').textContent = r.error; else toast('⚠ ' + r.error); if (btn) { btn.disabled = false; btn.textContent = '💾 Guardar en el Sheet'; } return; }
    aplicarEdicion(code, r.fila); cerrarModal(); toast(r.cambios ? '✅ Guardado en la hoja BAJA' : 'Sin cambios'); render();
  } catch (e) { if ($('#e_err')) $('#e_err').textContent = 'No pude guardar: ' + e.message; else toast('⚠ No pude guardar'); if (btn) { btn.disabled = false; btn.textContent = '💾 Guardar en el Sheet'; } }
}

function render() {
  if (!D) return;
  renderUser();
  CH.forEach(c => c.destroy()); CH = [];
  if (MAP) { MAP.remove(); MAP = null; }
  renderNav();
  const V = { solicitudes: vSolicitudes, consolidado: vConsolidado, resumen: vResumen, altas: vAltas, compraron: vCompraron, hoja: vHoja, alertas: vAlertas, equipo: vEquipo, calidad: vCalidad, auditor: vAuditor };
  $('#app').innerHTML = (V[S.tab] || vResumen)();
}
async function init() {
  try { const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); D = await r.json(); }
  catch (e) { $('#app').innerHTML = `<div class="card empty">No pude leer <b>data.json</b> (${esc(e.message)}). Corré “Actualizar todo” desde el menú 📋 ABM Galaxia del Sheet.</div>`; return; }
  if (EMBED && S.spv) {   // dentro de Ruta CCC: cada supervisor ve solo lo suyo
    const esSpv = x => spvOf(x) === S.spv;
    const promsSpv = new Set(D.altas.concat(D.bajas).filter(esSpv).map(x => (x.prom || '').replace(/^\d+--/, '')));
    D.altas = D.altas.filter(esSpv); D.bajas = D.bajas.filter(esSpv); D.solicitudes = (D.solicitudes || []).filter(x => x.spv === S.spv);
    D.altasPend = D.altasPend.filter(p => promsSpv.has(String(p.quien || '').toUpperCase()));
    if (D.hojaBaja) { const cS = D.hojaBaja.hdr.findIndex(x => x.toUpperCase().indexOf('SUPERVISOR') === 0); if (cS >= 0) D.hojaBaja.rows = D.hojaBaja.rows.filter(r => String(r.v[cS]).toUpperCase() === S.spv); }
  }
  for (const u of ['fotos.json', 'https://distribuidorazuppa.github.io/GESTION-CNC/fotos.json']) { try { const r = await fetch(u); if (r.ok) { FOTOS = await r.json(); break; } } catch (e) { } }
  const g = new Date(D.generado);
  $('#sub').textContent = `Actualizado ${g.toLocaleDateString('es-AR')} ${g.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })} · SLA altas ${D.cfg.slaAlta} días corridos · bajas ${D.cfg.slaBaja} días hábiles`;
  $('#upd').textContent = `${D.altas.length} altas · ${D.bajas.length} bajas`;
  $('#lnkSheet').href = sheetLink(D.cfg.gidAlta);
  const h = location.hash.replace('#', ''); if (TABS.some(t => t[0] === h)) S.tab = h;
  render();
  traerEdiciones().then(render);
  if (EMBED) try { parent.postMessage({ abmListo: true }, '*'); } catch (e) { }
}
if (EMBED) {
  let ultAlto = 0;
  const alto = () => { const sh = document.querySelector('.shell'), m = document.getElementById('modal');
    const hgt = Math.ceil(Math.max(sh ? sh.getBoundingClientRect().height : 0, m && m.firstChild ? 700 : 0));
    if (Math.abs(hgt - ultAlto) < 8) return; ultAlto = hgt; try { parent.postMessage({ abmAlto: hgt }, '*'); } catch (e) { } };
  new ResizeObserver(alto).observe(document.querySelector('.shell'));
  window.addEventListener('message', async e => {
    if (!/distribuidorazuppa\.github\.io|ccckpizuppa\.netlify\.app/.test(e.origin)) return;
    const a = e.data && e.data.abmAuth; if (!a || !a.clave || !D || !D.cfg.webApp || (S.user && S.user.clave === a.clave)) return;
    try { const r = await (await fetch(D.cfg.webApp + '?action=login&clave=' + encodeURIComponent(a.clave))).json(); if (r.ok) { S.user = { clave: a.clave, nombre: r.nombre, spv: r.spv }; guardarUser(S.user); render(); } } catch (err) { }
  });
}
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (D && TABS.some(t => t[0] === h) && h !== S.tab) { S.tab = h; render(); } });
init();
